services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: password
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails server -b 0.0.0.0"
    volumes:
      - .:/app
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/myapp_development
      # Update host/IP to point to the standalone Redis service (e.g. host.docker.internal or remote IP)
      REDIS_URL: ${REDIS_URL:-redis://host.docker.internal:6379/0}
      NEW_RELIC_LICENSE_KEY: 8f4b34ac6d48c94c9cdaae9fb8530642a032NRAL
      NEW_RELIC_APP_NAME: OrderService-Local

volumes:
  db_data: